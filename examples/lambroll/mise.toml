[env]
# Default values (override via .env or shell environment)
AWS_REGION = "ap-northeast-1"
BOARD_VERSION = "0.11.0"
LAMBDA_ARCH = "arm64"
# Load secrets from .env (ROLE_ARN, BOARD_API_*, OIDC, DynamoDB 等)
_.file = ".env"

[tasks.download]
description = "Download board binary from GitHub Release"
run = """
ARCHIVE="board_${BOARD_VERSION}_Linux_${LAMBDA_ARCH}.tar.gz"
curl -fsSL -o "${ARCHIVE}" "https://github.com/youyo/board/releases/download/v${BOARD_VERSION}/${ARCHIVE}"
tar xzf "${ARCHIVE}" board
rm -f "${ARCHIVE}"
"""

[tasks.package]
description = "Package board + bootstrap into function.zip"
depends = ["download"]
run = """
chmod +x board
zip -j function.zip bootstrap board
"""

[tasks.deploy]
description = "Deploy board MCP to Lambda via lambroll (with Function URL)"
depends = ["package"]
run = "lambroll deploy --function function.json --function-url function_url.json"

[tasks.clean]
description = "Remove packaging artifacts"
run = "rm -f board function.zip"

[tasks."dynamodb-create"]
description = "Create DynamoDB table for idproxy Store"
run = """
: "${BOARD_MCP_IDPROXY_STORE_DYNAMODB_TABLE:?set in .env}"
REGION="${BOARD_MCP_IDPROXY_STORE_DYNAMODB_REGION:-$AWS_REGION}"
aws dynamodb create-table \
  --table-name "${BOARD_MCP_IDPROXY_STORE_DYNAMODB_TABLE}" \
  --attribute-definitions AttributeName=pk,AttributeType=S \
  --key-schema AttributeName=pk,KeyType=HASH \
  --billing-mode PAY_PER_REQUEST \
  --region "${REGION}"
aws dynamodb wait table-exists \
  --table-name "${BOARD_MCP_IDPROXY_STORE_DYNAMODB_TABLE}" \
  --region "${REGION}"
echo "Table ${BOARD_MCP_IDPROXY_STORE_DYNAMODB_TABLE} created in ${REGION}."
"""

[tasks."dynamodb-delete"]
description = "Delete DynamoDB idproxy Store table (destructive)"
run = """
: "${BOARD_MCP_IDPROXY_STORE_DYNAMODB_TABLE:?set in .env}"
REGION="${BOARD_MCP_IDPROXY_STORE_DYNAMODB_REGION:-$AWS_REGION}"
aws dynamodb delete-table \
  --table-name "${BOARD_MCP_IDPROXY_STORE_DYNAMODB_TABLE}" \
  --region "${REGION}"
echo "Table ${BOARD_MCP_IDPROXY_STORE_DYNAMODB_TABLE} deletion requested in ${REGION}."
"""

[tasks."generate-signing-key"]
description = "Generate ECDSA P-256 signing key for BOARD_MCP_SIGNING_KEY"
run = """
openssl ecparam -name prime256v1 -genkey -noout -out signing.pem
echo "Wrote signing.pem. Convert to env-friendly form:"
echo "  awk 'NR==1{printf \\"%s\\", \\$0; next} {printf \\"\\\\\\\\n%s\\", \\$0}' signing.pem"
echo "and set the result as BOARD_MCP_SIGNING_KEY in .env"
"""
