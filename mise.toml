[tools]
node = "24.21.0"
pnpm = "11.28.5"

[tasks.install]
description = "依存パッケージをロックファイルどおりに入れる"
run = "pnpm install --frozen-lockfile"

[tasks."test:unit"]
description = "Unit テスト (workerd 上で実行)"
run = "pnpm exec vitest run --project unit"

[tasks."test:e2e"]
description = "E2E テスト (Worker 全体に HTTP を送る。Access の JWKS は outbound fetch のモック。node-e2e は生成スクリプトを実プロセスで起動)"
run = "pnpm exec vitest run --project e2e --project node-e2e"

[tasks."test:update-snapshots"]
description = "tools/list のスナップショットを更新する (ツール定義を意図して変えたときだけ)"
run = "pnpm exec vitest run --project unit --update test/unit/tools-list-snapshot.test.ts"

[tasks.test]
description = "Unit + E2E"
depends = ["test:unit", "test:e2e"]

[tasks.lint]
description = "Biome + 型検査"
run = ["pnpm exec biome check .", "pnpm exec tsc --noEmit"]

[tasks.fmt]
description = "Biome で整形"
run = "pnpm exec biome check --write ."

[tasks.build]
description = "デプロイせずにバンドルできることを確認する"
run = "pnpm exec wrangler deploy --dry-run --outdir dist"

[tasks.dev]
description = "ローカル開発サーバー"
run = "pnpm exec wrangler dev"

[tasks."deploy:render"]
description = "デプロイ用の wrangler 設定 (wrangler.deploy.jsonc、gitignore 済み) を wrangler.jsonc と BOARD_* 環境変数から生成する (値は mise.local.toml の [env]。手順は docs/runbook.md)"
run = "node scripts/render-wrangler-config/main.ts"

[tasks."deploy:check"]
description = "デプロイ設定の生成と wrangler の dry-run を、ダミー値で検証する (環境変数・秘密情報は不要。Cloudflare へは何も変更しない)"
run = [
  "node scripts/render-wrangler-config/main.ts --example",
  "pnpm exec wrangler deploy --dry-run -c wrangler.deploy.example.jsonc --outdir dist",
]

[tasks.deploy]
description = "デプロイ設定を生成して Cloudflare へデプロイする (実行はユーザー。値は mise.local.toml の [env]。手順は docs/runbook.md)"
run = [
  "node scripts/render-wrangler-config/main.ts",
  "pnpm exec wrangler deploy -c wrangler.deploy.jsonc",
]

[tasks."test:live"]
description = "実環境の確認 (デプロイ済み Worker に Access の service token で接続し、読み取りツールを呼んで計測する。BOARD_LIVE_URL / BOARD_LIVE_ACCESS_CLIENT_ID / BOARD_LIVE_ACCESS_CLIENT_SECRET が必要。test には含めない)"
run = "pnpm exec vitest run --project live"
