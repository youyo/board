[tools]
node = "24.21.0"
pnpm = "11.28.5"

[tasks.install]
description = "依存パッケージをロックファイルどおりに入れる"
run = "pnpm install --frozen-lockfile"

[tasks."test:unit"]
description = "Unit テスト (workerd 上で実行)"
run = "pnpm exec vitest run --project unit"

[tasks."test:e2e"]
description = "E2E テスト (Worker 全体に HTTP を送る。Access の JWKS は outbound fetch のモック。node-e2e は生成スクリプトを実プロセスで起動)"
run = "pnpm exec vitest run --project e2e --project node-e2e"

[tasks."test:update-snapshots"]
description = "tools/list のスナップショットを更新する (ツール定義を意図して変えたときだけ)"
run = "pnpm exec vitest run --project unit --update test/unit/tools-list-snapshot.test.ts"

[tasks.test]
description = "Unit + E2E"
depends = ["test:unit", "test:e2e"]

[tasks.lint]
description = "Biome + 型検査"
run = ["pnpm exec biome check .", "pnpm exec tsc --noEmit"]

[tasks.fmt]
description = "Biome で整形"
run = "pnpm exec biome check --write ."

[tasks.build]
description = "デプロイせずにバンドルできることを確認する"
run = "pnpm exec wrangler deploy --dry-run --outdir dist"

[tasks.dev]
description = "ローカル開発サーバー"
run = "pnpm exec wrangler dev"

# ---- デプロイ(下流向け。docs/runbook.md) ----
# 下流が書く設定は board.config.json(秘密でない値だけ。board.config.example.json をコピー)。
# deploy:config が upstream の wrangler.jsonc と board.config.json から deploy/wrangler.jsonc を生成する(下流でコミットする)。
[tasks.setup]
description = "初回のデプロイを 1 本で行う(前提の確認 → D1 の作成と board.config.json への書き戻し → deploy:config → deploy → secrets → /healthz の確認 → Access / Portal の案内)。何度でも再実行できる。使い方: mise run setup -- [--yes]"
run = "bash scripts/setup.sh"

[tasks."deploy:config"]
description = "board.config.json と upstream の wrangler.jsonc から deploy/wrangler.jsonc を生成する(生成物は下流でコミットする)。エラーは項目名だけを出す"
run = "node scripts/deploy-config/main.ts generate"

[tasks."deploy:config:validate"]
description = "board.config.json の形式を検証するだけ(d1.databaseId が未作成でもよい。生成も Cloudflare への通信もしない。エラーは項目名だけ)"
run = "node scripts/deploy-config/main.ts validate --pending-d1"

[tasks."deploy:config:check"]
description = "deploy/wrangler.jsonc が、board.config.json と upstream の wrangler.jsonc から作り直した結果と一致するかを確かめる(ファイルは書かない。下流の CI 用。資格情報は要らない)"
run = "node scripts/deploy-config/main.ts check"

[tasks."deploy:check"]
description = "example の設定(ダミー値。workers.dev の形とカスタムドメインの形の両方)から deploy 用の設定を生成し、wrangler deploy --dry-run が通ることを確かめる(Cloudflare へは何も変更しない。CI でも走る)"
run = [
  "node scripts/deploy-config/main.ts generate --example",
  "pnpm exec wrangler deploy --dry-run -c .wrangler/deploy-example/wrangler.jsonc --outdir dist",
  "node scripts/deploy-config/main.ts generate --example --with-domain",
  "pnpm exec wrangler deploy --dry-run -c .wrangler/deploy-example-domain/wrangler.jsonc --outdir dist",
]

[tasks.deploy]
description = "deploy/wrangler.jsonc で Cloudflare へデプロイする(実行はユーザー)。deploy/ が無い、または <...> が残っていれば何もせず止まる。先に mise run deploy:config"
run = "bash scripts/deploy.sh"

[tasks."test:live"]
description = "実環境の確認 (デプロイ済み Worker に Access の service token で接続し、読み取りツールを呼んで計測する。BOARD_LIVE_URL / BOARD_LIVE_ACCESS_CLIENT_ID / BOARD_LIVE_ACCESS_CLIENT_SECRET が必要。test には含めない)"
run = "pnpm exec vitest run --project live"
