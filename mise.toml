[tools]
go = "1.26"

[tasks.build]
description = "Build the board binary"
run = "go build -ldflags \"-X main.version=dev\" -o board ./cmd/board"

[tasks.test]
description = "Run all tests"
run = "go test ./..."

[tasks.vet]
description = "Run go vet"
run = "go vet ./..."

[tasks.fmt]
description = "Format Go source code"
run = "gofmt -s -w ."

[tasks."test:e2e"]
description = "Run E2E tests against the real BOARD API (requires BOARD_API_KEY and BOARD_API_TOKEN)"
run = "go test -tags e2e -v -count=1 ./internal/boardapi/ ./internal/service/find/"

[tasks."test:e2e:single"]
description = "Run a single E2E test (rate-limit safe). Usage: mise run test:e2e:single -- -run TestE2E_Foo"
run = "go test -tags e2e -v -count=1 ./internal/boardapi/ ./internal/service/find/"

[tasks.lint]
description = "Run golangci-lint"
run = "golangci-lint run"

[tasks.clean]
description = "Remove build artifacts"
run = "rm -f board"

[tasks.sync-docs]
description = "Sync docs/ + README.md to internal/docs/assets/ for go:embed"
run = """
rm -rf internal/docs/assets
mkdir -p internal/docs/assets
cp README.md internal/docs/assets/README.md
rsync -a --exclude=specs docs/ internal/docs/assets/
"""

[tasks.check-docs-sync]
description = "Verify internal/docs/assets/ is in sync with docs/ + README.md (fails if drift detected)"
run = """
set -e
tmp=$(mktemp -d)
cp README.md "$tmp/README.md"
rsync -a --exclude=specs docs/ "$tmp/"
diff -r "$tmp" internal/docs/assets
rm -rf "$tmp"
"""
