[tools]
go = "1.26"

[tasks.build]
description = "Build the board binary"
run = "go build -ldflags \"-X main.version=dev\" -o board ./cmd/board"

[tasks.test]
description = "Run all tests"
run = "go test ./..."

[tasks.vet]
description = "Run go vet"
run = "go vet ./..."

[tasks.fmt]
description = "Format Go source code"
run = "gofmt -s -w ."

[tasks."test:e2e"]
description = "Run E2E tests against the real BOARD API (requires BOARD_API_KEY and BOARD_API_TOKEN)"
run = "go test -tags e2e -v -count=1 ./internal/boardapi/ ./internal/service/find/"

[tasks.clean]
description = "Remove build artifacts"
run = "rm -f board"
