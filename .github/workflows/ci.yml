name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # アクションはコミット SHA で固定している(タグは SHA の横のコメント)。
      # 更新するときは `gh api repos/<owner>/<repo>/git/ref/tags/<tag>` で commit SHA を確かめる(annotated tag なら git/tags/<sha> で辿る)。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # mise.toml の node / pnpm を入れる。
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          version: 2026.10.9 # 公開 2026-10-13（2 週間ルール）
      - run: mise run install
      - run: mise run lint
      - run: mise run test
      # board.config.example.json のダミー値でデプロイ設定を生成し、wrangler deploy --dry-run が通ることを確かめる(Cloudflare へは何も送らない)。
      - run: mise run deploy:check

  # 秘密値の走査(全履歴。設定は .gitleaks.toml)。gitleaks-action は組織ではライセンスが要るので使わず、mise で固定した gitleaks を直接走らせる。
  secrets-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # 全履歴
          persist-credentials: false
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          version: 2026.10.9 # 公開 2026-10-13（2 週間ルール）
      - run: mise run secrets:scan

  # Actions の SHA 固定が保たれているか(pinact run --check)。
  pinact:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          version: 2026.10.9 # 公開 2026-10-13（2 週間ルール）
      - run: mise run pinact:check
        env:
          GITHUB_TOKEN: ${{ github.token }}

  # 本番依存の監査(開発用の依存は対象外)。
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          version: 2026.10.9 # 公開 2026-10-13（2 週間ルール）
      - run: mise run install
      - run: mise run audit

  # upstream 専用(下流では github.repository が違うので自動で止まる。下流は board.config.json と deploy/ を追跡するのが正しい)。
  # 下流の設定(実値を含む)を upstream に追跡させない。.gitignore に入っているが、git add -f で入るのを防ぐ。
  no-downstream-files:
    if: github.repository == 'youyo/board'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: board.config.json と deploy/ が追跡されていないこと
        run: |
          tracked="$(git ls-files board.config.json deploy)"
          if [ -n "$tracked" ]; then
            echo "upstream に下流の設定が追跡されている(実値を入れない。ADR 0005):" >&2
            echo "$tracked" >&2
            exit 1
          fi
